{% extends "base.html" %}{% block content %}<section class="narrow"><h1>Crear informe</h1><form method="post" class="card"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Cliente<select name="cliente_id" required>{% for c in clientes %}<option value="{{ c.id }}">{{ c.nombre }}</option>{% endfor %}</select></label><label>Título<input name="titulo" maxlength="150" required></label><label>Contenido<textarea name="contenido" class="large" required></textarea></label><button>Guardar informe</button></form></section>{% endblock %}
