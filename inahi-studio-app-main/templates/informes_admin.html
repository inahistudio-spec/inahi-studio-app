{% extends "base.html" %}{% block content %}<div class="title-row"><h1>Informes</h1><a class="button" href="{{ url_for('crear_informe') }}">Crear informe</a></div>{% for i in informes %}<article class="card"><h2>{{ i.titulo }}</h2><p><strong>Cliente:</strong> {{ i.nombre }} · {{ i.fecha }}</p><p class="pre">{{ i.contenido }}</p></article>{% else %}<p class="empty">No hay informes.</p>{% endfor %}{% endblock %}
