{% extends "base.html" %}{% block content %}<h1>Solicitudes de clientes</h1>{% for s in solicitudes %}<article class="card"><h2>{{ s.asunto }}</h2><p><strong>Cliente:</strong> {{ s.nombre }}</p><p>{{ s.descripcion }}</p><p><span class="badge">{{ s.estado }}</span></p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="solicitud_id" value="{{ s.id }}"><label>Respuesta<textarea name="respuesta" required>{{ s.respuesta }}</textarea></label><button>Guardar respuesta</button></form></article>{% else %}<p class="empty">No hay solicitudes.</p>{% endfor %}{% endblock %}
