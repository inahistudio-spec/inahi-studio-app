{% extends "base.html" %}{% block content %}<section class="narrow"><h1>Editar cliente</h1><form method="post" class="card"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Nombre<input name="nombre" value="{{ cliente.nombre }}" required></label><label>Correo<input type="email" name="correo" value="{{ cliente.correo }}" required></label><label>Plan<select name="plan">{% for p in planes %}<option {% if p==cliente.plan %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></label><label>Nueva contraseña (opcional)<input type="password" name="nueva_contrasena" minlength="8"></label><button>Guardar cambios</button></form></section>{% endblock %}
