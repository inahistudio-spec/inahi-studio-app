{% extends "base.html" %}{% block content %}<h1>Reuniones solicitadas</h1>{% for c in citas %}<article class="card"><h2>{{ c.nombre }}</h2><p><strong>{{ c.fecha }} · {{ c.hora }}</strong><br>{{ c.modalidad }} — {{ c.motivo }}</p><p><span class="badge">{{ c.estado }}</span></p><form method="post" action="{{ url_for('cambiar_estado_cita',cid=c.id) }}" class="actions"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button name="estado" value="Confirmada">Confirmar</button><button name="estado" value="Cancelada" class="danger">Cancelar</button></form></article>{% else %}<p class="empty">No hay reuniones.</p>{% endfor %}{% endblock %}
