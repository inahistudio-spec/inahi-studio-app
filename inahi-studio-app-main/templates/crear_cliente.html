{% extends "base.html" %}{% block content %}<section class="narrow"><h1>Crear cliente</h1><form method="post" class="card"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Nombre o empresa<input name="nombre" required></label><label>Correo electrónico<input type="email" name="correo" required></label><label>Contraseña inicial<input type="password" name="contrasena" minlength="8" required></label><label>Plan<select name="plan" required>{% for p in planes %}<option>{{ p }}</option>{% endfor %}</select></label><button>Crear cliente</button></form></section>{% endblock %}
